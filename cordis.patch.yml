# dsh-solution-explorer bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:path/to/dsh-solution-explorer`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (workspace-gated fs service + /solution-explorer routes),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/ui-dsh-solution-explorer/client.js)
# load in the web GUI.
- insert:
    - id: ui-dsh-solution-explorer
      name: dsh-solution-explorer
